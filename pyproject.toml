[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litefno-repro"
version = "0.1.0"
description = "Reproduction and extensions for Lightweight Fourier Neural Operator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "numpy",
  "scipy",
  "matplotlib",
  "tqdm",
  "h5py",
  "pyyaml",
  "neuraloperator",
  # streaming The Well over HTTP range requests (scripts/stream_preprocess.py,
  # harmonic_content.open_remote). aiohttp is not imported directly -- it is
  # the backend fsspec's "http" filesystem requires, and without it the stream
  # fails at read time rather than at import.
  "fsspec",
  "huggingface_hub",
  "aiohttp",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
litefno = "litefno.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
