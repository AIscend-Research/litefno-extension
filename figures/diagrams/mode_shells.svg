<text x="90" y="47" font-size="12" opacity="0.7" text-anchor="middle">k<tspan font-size="9" dy="3">y</tspan></text>
<circle cx="452" cy="118" r="6.5" fill="#d2673a"/>
<text x="468" y="123" font-size="12.5">gets a learnable bias b</text>
<text x="468" y="141" font-size="11" opacity="0.65">27 of 144 modes</text>
<circle cx="452" cy="170" r="3.2" fill="currentColor" opacity="0.28"/>
<text x="468" y="175" font-size="12.5" opacity="0.8">weight only</text>
<text x="452" y="228" font-size="12.5" font-weight="600">Why a ring, not a point</text>
<text x="452" y="250" font-size="11.5" opacity="0.75">A Turing pattern selects a wavelength,</text>
<text x="452" y="267" font-size="11.5" opacity="0.75">not an orientation, so its energy spreads</text>
<text x="452" y="284" font-size="11.5" opacity="0.75">around the whole shell. Selecting on |k|</text>
<text x="452" y="301" font-size="11.5" opacity="0.75">follows the physics; selecting on a single</text>
<text x="452" y="318" font-size="11.5" opacity="0.75">orientation would catch one slice of it.</text>
<text x="452" y="368" font-size="12.5" font-weight="600" fill="#2f7d63">Where ext10 says the energy is</text>
<text x="452" y="390" font-size="11.5" opacity="0.75">maze and spots hold ~99% of their spatial</text>
<text x="452" y="407" font-size="11.5" opacity="0.75">variance in the mid-spectrum Turing band,</text>
<text x="452" y="424" font-size="11.5" opacity="0.75">not at low wavenumber — which is why the</text>
<text x="452" y="441" font-size="11.5" opacity="0.75">fundamental sits at 3.5 and not at 1.</text>
<text x="30" y="458" font-size="11.5" opacity="0.6">Shells at a fundamental of 3.5 and its integer multiples, annulus half-width 0.5.</text>
<text x="30" y="475" font-size="11.5" opacity="0.6">Drawn in centred k_y order; the layer stores the negative half folded to the end.</text>
</g></svg>
