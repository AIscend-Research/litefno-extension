<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" color="#12151c" role="img" aria-label="The spectral layer: a shared FFT path whose weight tensor is stored either densely as 589,824 parameters or in CP form as 4,896, with an optional learnable bias on harmonic shells.">
  <defs>
    <marker id="sl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="sl-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d2673a"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="currentColor">

    <!-- shared path -->
    <text x="30" y="34" font-size="13" font-weight="600" opacity="0.55" letter-spacing="0.08em">SHARED SPECTRAL PATH</text>

    <g stroke="currentColor" stroke-width="1.4" fill="none">
      <rect x="30"  y="52" width="86" height="46" rx="5"/>
      <rect x="156" y="52" width="78" height="46" rx="5"/>
      <rect x="274" y="52" width="120" height="46" rx="5"/>
      <rect x="434" y="52" width="96" height="46" rx="5" stroke="#d2673a" stroke-width="2"/>
      <rect x="570" y="52" width="96" height="46" rx="5" stroke="#d2673a" stroke-width="2" stroke-dasharray="5 3"/>
      <rect x="706" y="52" width="78" height="46" rx="5"/>
      <rect x="824" y="52" width="86" height="46" rx="5"/>
    </g>

    <g font-size="13" text-anchor="middle">
      <text x="73"  y="80">u(x)</text>
      <text x="195" y="80">rfft2</text>
      <text x="334" y="75">truncate</text>
      <text x="334" y="90" font-size="11" opacity="0.7">m₁ × m₂</text>
      <text x="482" y="80" font-weight="600">û · W</text>
      <text x="618" y="75" font-weight="600" fill="#d2673a">+ b</text>
      <text x="618" y="90" font-size="11" fill="#d2673a" opacity="0.85">on shells H</text>
      <text x="745" y="80">irfft2</text>
      <text x="867" y="80">y(x)</text>
    </g>

    <g stroke="currentColor" stroke-width="1.4" marker-end="url(#sl-arrow)">
      <line x1="116" y1="75" x2="150" y2="75"/>
      <line x1="234" y1="75" x2="268" y2="75"/>
      <line x1="394" y1="75" x2="428" y2="75"/>
      <line x1="530" y1="75" x2="564" y2="75"/>
      <line x1="666" y1="75" x2="700" y2="75"/>
      <line x1="784" y1="75" x2="818" y2="75"/>
    </g>

    <text x="618" y="120" font-size="11" text-anchor="middle" fill="#d2673a" opacity="0.9">optional · input-independent</text>

    <!-- split down to the two weight stores -->
    <g stroke="#d2673a" stroke-width="1.6" fill="none">
      <path d="M 482 98 L 482 140 L 250 140 L 250 176" marker-end="url(#sl-arrow-accent)"/>
      <path d="M 482 98 L 482 140 L 712 140 L 712 176" marker-end="url(#sl-arrow-accent)"/>
    </g>
    <text x="497" y="136" font-size="12" fill="#d2673a" font-weight="600">W is stored one of two ways</text>

    <!-- dense -->
    <text x="250" y="200" font-size="14" font-weight="600" text-anchor="middle">Dense — FNO-S</text>

    <g stroke="currentColor" stroke-width="1.3" fill="none" opacity="0.9">
      <rect x="150" y="218" width="200" height="104" rx="4"/>
      <line x1="150" y1="244" x2="350" y2="244"/>
      <line x1="150" y1="270" x2="350" y2="270"/>
      <line x1="150" y1="296" x2="350" y2="296"/>
      <line x1="190" y1="218" x2="190" y2="322"/>
      <line x1="230" y1="218" x2="230" y2="322"/>
      <line x1="270" y1="218" x2="270" y2="322"/>
      <line x1="310" y1="218" x2="310" y2="322"/>
    </g>
    <text x="250" y="343" font-size="12.5" text-anchor="middle" opacity="0.85">one complex number per (i, o, k₁, k₂)</text>
    <text x="250" y="371" font-size="15" text-anchor="middle" font-weight="600">589,824 params</text>
    <text x="250" y="391" font-size="11.5" text-anchor="middle" opacity="0.65">64 · 64 · 12 · 12</text>

    <!-- CP -->
    <text x="712" y="200" font-size="14" font-weight="600" text-anchor="middle">CP rank R — LiteFNO</text>

    <g stroke="currentColor" stroke-width="1.3" fill="none">
      <rect x="566" y="218" width="26" height="104" rx="3"/>
      <rect x="614" y="218" width="26" height="104" rx="3"/>
      <rect x="662" y="218" width="26" height="104" rx="3"/>
      <rect x="710" y="218" width="26" height="104" rx="3"/>
      <rect x="772" y="218" width="86" height="26" rx="3"/>
    </g>
    <g font-size="10.5" text-anchor="middle" opacity="0.75">
      <text x="579" y="338">C×R</text>
      <text x="627" y="338">C×R</text>
      <text x="675" y="338">m₁×R</text>
      <text x="723" y="338">m₂×R</text>
      <text x="815" y="260">λ (R)</text>
    </g>
    <text x="754" y="276" font-size="17" text-anchor="middle" opacity="0.6">⊗</text>
    <text x="712" y="371" font-size="15" text-anchor="middle" font-weight="600" fill="#2f7d63">4,896 params</text>
    <text x="712" y="391" font-size="11.5" text-anchor="middle" opacity="0.65">32 · (64 + 64 + 12 + 12) + 32</text>

    <!-- the delta -->
    <text x="481" y="272" font-size="26" text-anchor="middle" opacity="0.35">→</text>
    <text x="481" y="300" font-size="14" text-anchor="middle" font-weight="700" fill="#2f7d63">120× fewer</text>

    <text x="30" y="420" font-size="11.5" opacity="0.6">Instantiated at width 64, 12 retained modes, rank 32. Setting harmonic_bias=False makes the dashed block vanish and reproduces plain CP exactly.</text>
  </g>
</svg>
